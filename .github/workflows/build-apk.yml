name: Build APK

# 推送任意分支 / 手动触发时自动在线编译 Debug APK
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 允许自动发布 Release(contents: write)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Ubuntu 镜像已预装 Android SDK 34,无需额外安装 SDK 组件
      - name: Set up Gradle 8.7 (无需本地 wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Get app version
        id: ver
        run: echo "v=$(grep -oP 'versionName = \"\K[^\"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          echo "Building version ${{ steps.ver.outputs.v }}"
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/bluetooth-serial-${{ steps.ver.outputs.v }}.apk"

      - name: Upload APK 产物(zip 与 APK 文件名都带版本号)
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-serial-apk-${{ steps.ver.outputs.v }}
          path: app/build/outputs/apk/debug/bluetooth-serial-*.apk
          if-no-files-found: error

      # 构建成功后自动发布 GitHub Release,作为 App 在线更新源
      - name: Publish to GitHub Release (在线更新源)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.v }}"
          TAG="v$VER"
          # 同版本重复构建时先删除旧 Release 再重建(幂等),删除失败可忽略
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # 创建 Release,失败自动重试(应对 GitHub 503/429 等临时故障)
          for i in 1 2 3 4 5 6 7 8; do
            if gh release create "$TAG" app/build/outputs/apk/debug/bluetooth-serial-*.apk \
                --title "Zxg蓝牙调试助手 v$VER" \
                --notes "自动构建发布 v$VER" \
                --generate-notes \
                --latest; then
              echo "Release $TAG created successfully"
              exit 0
            fi
            echo "gh release create failed (attempt $i/8), retrying in 15s..."
            sleep 15
          done
          echo "Release creation failed after 8 attempts"
          exit 1
